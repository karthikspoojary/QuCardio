server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Batch endpoint — large body, long timeout ─────────────────────────────
    # Allows up to 20 files × 20 MB + multipart overhead.
    # Quantum batch inference: 20 files × ~15 s = ~300 s.
    location /predict/batch {
        proxy_pass                 http://backend:8000;
        proxy_set_header           Host $host;
        proxy_set_header           X-Real-IP $remote_addr;
        proxy_set_header           X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout         600s;
        proxy_send_timeout         600s;
        client_max_body_size       420m;
    }

    # ── All other API endpoints — single-file cap, shorter timeout ────────────
    # BUG FIX: the old catch-all applied client_max_body_size 420m to every
    # endpoint, letting attackers send a 420 MB request to any route.  Cap at
    # 21 MB here; the backend's MAX_FILE_BYTES guard provides a second layer.
    location ~ ^/(predict|health|docs|openapi|circuit|history|ablation_data) {
        proxy_pass                 http://backend:8000;
        proxy_set_header           Host $host;
        proxy_set_header           X-Real-IP $remote_addr;
        proxy_set_header           X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout         120s;
        proxy_send_timeout         120s;
        client_max_body_size       21m;
    }

    # ── SPA fallback — React Router support ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
