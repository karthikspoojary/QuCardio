server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API calls to FastAPI backend
    # Covers: /predict/*, /health, /docs, /openapi, /circuit, /history/*, /ablation_data
    location ~ ^/(predict|health|docs|openapi|circuit|history|ablation_data) {
        proxy_pass             http://backend:8000;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        # Batch quantum inference can take ~300s for 20 files × 15s/file
        proxy_read_timeout     600s;
        proxy_send_timeout     600s;
        # Allow large image uploads (batch of 20 × 20 MB)
        client_max_body_size   420m;
    }

    # SPA fallback — React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }
}
