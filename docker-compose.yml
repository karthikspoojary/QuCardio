version: "3.9"

services:

  # ── Redis Cache ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: qucardio-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qucardio-backend
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      # Mount trained models from host so we don't bake 1GB+ into the image
      - ./backend/models:/app/backend/models:ro
      # Mount only the three cache files the backend loads — not the entire data tree
      # (avoids exposing raw training ECG images if the API container is compromised)
      - ./data/sv_train_qsvc.npz:/app/data/sv_train_qsvc.npz:ro
      - ./data/sv_train_pegasos.npz:/app/data/sv_train_pegasos.npz:ro
      - ./data/features_9d.npz:/app/data/features_9d.npz:ro
      # Persist SQLite audit log — use a named volume so Docker never creates a directory
      # instead of a file at this path (which would break SQLite on first startup)
      - qucardio_audit:/app/backend
      # Persist PDF reports
      - /tmp/qucardio_reports:/tmp/qucardio_reports
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qucardio-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: qucardio-network

volumes:
  qucardio_audit:   # Named volume for SQLite audit DB — prevents directory-vs-file confusion
